openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Project Alpha API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyse
    description: Property feasibility analysis
  - name: chat
    description: AI chat operations
  - name: auth
    description: Authentication operations
  - name: storage
    description: File storage operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyse:
    post:
      operationId: analyseProperty
      tags: [analyse]
      summary: Analyse a specific property address
      description: Runs the full feasibility pipeline for a given NZ property address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyseRequest"
      responses:
        "200":
          description: Feasibility report generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyseResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chat:
    post:
      operationId: chat
      tags: [chat]
      summary: Send a chat message to the AI
      description: Sends a message to Claude with full conversation context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /search:
    post:
      operationId: searchProperties
      tags: [analyse]
      summary: Discovery search for development opportunities
      description: Search for subdividable properties matching given criteria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a new account
      description: Register as general user, sales agent, or service provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Log in to an existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /upload/incorporation-cert:
    post:
      operationId: uploadIncorporationCert
      tags: [storage]
      summary: Upload a Certificate of Incorporation
      description: Accepts a multipart PDF or image file. Stores it in object storage and returns the serving URL. Used during service provider signup.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF or image file (max 10MB)
              required:
                - file
      responses:
        "201":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCertResponse"
        "400":
          description: No file or invalid file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/service-provider/cert:
    patch:
      operationId: updateServiceProviderCert
      tags: [auth]
      summary: Update service provider incorporation certificate URL
      description: Updates the incorporation certificate URL for the authenticated service provider after signup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [incorporationCertUrl]
              properties:
                incorporationCertUrl:
                  type: string
      responses:
        "200":
          description: Certificate URL updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      description: Returns a presigned GCS URL for direct file upload. The client uploads the file directly to GCS using the returned URL.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password
    SignUpRequestBase:
      type: object
      description: Provide either fullName or both firstName and lastName.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
          description: Legacy field — alternative to firstName + lastName
        languages:
          type: array
          items:
            type: string
          description: Languages the user speaks
      required:
        - email
        - password
    SignUpRequest:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/SignUpRequestBase"
            - type: object
              properties:
                role:
                  type: string
                  enum: [general]
                  default: general
        - allOf:
            - $ref: "#/components/schemas/SignUpRequestBase"
            - type: object
              properties:
                role:
                  type: string
                  enum: [sales_agent]
                agentData:
                  $ref: "#/components/schemas/SalesAgentSignUpData"
              required:
                - role
                - agentData
        - allOf:
            - $ref: "#/components/schemas/SignUpRequestBase"
            - type: object
              properties:
                role:
                  type: string
                  enum: [service_provider]
                providerData:
                  $ref: "#/components/schemas/ServiceProviderSignUpData"
              required:
                - role
                - providerData
      discriminator:
        propertyName: role
    SalesAgentSignUpData:
      type: object
      properties:
        agencyName:
          type: string
        reaaLicenceNumber:
          type: string
        yearsExperience:
          type: integer
          minimum: 0
        regionsCovered:
          type: array
          items:
            type: string
        propertyTypes:
          type: array
          items:
            type: string
        websiteUrl:
          type: string
        bio:
          type: string
    ServiceProviderSignUpData:
      type: object
      properties:
        companyName:
          type: string
        NZBN:
          type: string
        discipline:
          type: string
          enum: [architect_designer, planner, engineer, quantity_surveyor, other]
        addressStreet:
          type: string
        addressSuburb:
          type: string
        addressCity:
          type: string
        addressPostcode:
          type: string
        contactNumber:
          type: string
        incorporationCertUrl:
          type: string
    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        fullName:
          type: string
          nullable: true
        role:
          type: string
          enum: [general, sales_agent, service_provider]
        languages:
          type: array
          items:
            type: string
        subscriptionTier:
          type: string
        reportsUsedThisMonth:
          type: integer
      required:
        - id
        - email
        - role
        - subscriptionTier
        - reportsUsedThisMonth
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - token
        - user
    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - user
    UploadCertResponse:
      type: object
      properties:
        objectPath:
          type: string
          description: Normalized object path (e.g. /objects/uploads/uuid)
        fileUrl:
          type: string
          description: Auth-gated serving URL for the uploaded file (/api/storage/objects/...). Requires a valid Authorization header. Not a public GCS URL.
        metadata:
          type: object
          properties:
            name:
              type: string
            size:
              type: integer
            contentType:
              type: string
      required:
        - objectPath
        - fileUrl
    RequestUploadUrlBody:
      type: object
      properties:
        name:
          type: string
          description: Original file name
        size:
          type: integer
          description: File size in bytes
        contentType:
          type: string
          description: MIME type of the file
      required:
        - name
        - size
        - contentType
    RequestUploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
          description: Presigned GCS URL for direct upload
        objectPath:
          type: string
          description: Normalized object path to store in DB (e.g. /objects/uploads/uuid)
        metadata:
          type: object
          properties:
            name:
              type: string
            size:
              type: integer
            contentType:
              type: string
      required:
        - uploadURL
        - objectPath
    AnalyseRequest:
      type: object
      properties:
        address:
          type: string
          description: The NZ property address to analyse
        conversationHistory:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      required:
        - address
    ChatRequest:
      type: object
      properties:
        message:
          type: string
          description: The user message
        conversationHistory:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        reportContext:
          type: string
          description: JSON string of the current property report for context
      required:
        - message
    SearchRequest:
      type: object
      properties:
        query:
          type: string
          description: Natural language search query
        suburb:
          type: string
        minPrice:
          type: number
        maxPrice:
          type: number
        criteria:
          type: string
      required:
        - query
    Message:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required:
        - role
        - content
    Score:
      type: object
      properties:
        ease:
          type: number
          description: Ease of development score out of 5
        cost:
          type: number
          description: Cost to develop score out of 5 (5 = low cost)
        roi:
          type: number
          description: Potential ROI score out of 5
        composite:
          type: number
          description: Composite overall score out of 5
      required:
        - ease
        - cost
        - roi
        - composite
    PropertyOverview:
      type: object
      properties:
        address:
          type: string
        cv:
          type: string
        landArea:
          type: string
        floorArea:
          type: string
        buildYear:
          type: string
        zone:
          type: string
        listingPrice:
          type: string
        isOnMarket:
          type: boolean
    PlanningOverlay:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [clear, moderate, restricted]
        detail:
          type: string
      required:
        - name
        - status
        - detail
    PlanningInfo:
      type: object
      properties:
        zone:
          type: string
        minLotSize:
          type: string
        potentialLots:
          type: number
        overlays:
          type: array
          items:
            $ref: "#/components/schemas/PlanningOverlay"
        subdivisionSummary:
          type: string
    AsbestosInfo:
      type: object
      properties:
        buildYear:
          type: string
        riskLevel:
          type: string
          enum: [low, moderate, high]
        flagged:
          type: boolean
        demoCostLow:
          type: number
        demoCostHigh:
          type: number
        worksafeNote:
          type: string
    TerrainInfo:
      type: object
      properties:
        classification:
          type: string
          enum: [flat, gentle, moderate, steep]
        slope:
          type: string
        retainingCostLow:
          type: number
        retainingCostHigh:
          type: number
    InfrastructureService:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
          enum: [on-parcel, boundary, off-parcel]
        estimatedCostLow:
          type: number
        estimatedCostHigh:
          type: number
        risk:
          type: string
          enum: [low, moderate, high]
        note:
          type: string
      required:
        - name
        - location
        - risk
    CostItem:
      type: object
      properties:
        label:
          type: string
        low:
          type: number
        high:
          type: number
      required:
        - label
        - low
        - high
    ROIScenario:
      type: object
      properties:
        years:
          type: number
        gdv:
          type: number
        totalCost:
          type: number
        grossProfit:
          type: number
        roi:
          type: number
        annualisedRoi:
          type: number
        isBest:
          type: boolean
      required:
        - years
        - gdv
        - totalCost
        - grossProfit
        - roi
        - annualisedRoi
        - isBest
    ComparableSale:
      type: object
      properties:
        address:
          type: string
        saleDate:
          type: string
        price:
          type: number
        size:
          type: number
        pricePerSqm:
          type: number
        typology:
          type: string
          enum: [standalone, terrace_townhouse, unit_apartment, unknown]
        distanceM:
          type: number
          nullable: true
        source:
          type: string
          enum: [oneroof_sold, realestate_active_listing, licensed_provider, unknown]
        relevanceScore:
          type: number
        selectionReason:
          type: string
      required:
        - address
        - saleDate
        - price
        - size
        - pricePerSqm
    NeighbourhoodSignal:
      type: object
      properties:
        level:
          type: string
          enum: [none, low, moderate, high, unknown]
        count:
          type: number
        assessedLots:
          type: number
        confidence:
          type: string
          enum: [high, medium, low, unknown]
      required:
        - level
        - count
        - assessedLots
        - confidence
    NeighbourhoodContext:
      type: object
      properties:
        assessedLots:
          type: number
        radiusM:
          type: number
        publicHousingSignal:
          $ref: "#/components/schemas/NeighbourhoodSignal"
        terraceHousingSignal:
          $ref: "#/components/schemas/NeighbourhoodSignal"
        confidence:
          type: string
          enum: [high, medium, low, unknown]
        marketAdjustment:
          type: object
          properties:
            gdvMultiplier:
              type: number
            applied:
              type: boolean
            reason:
              type: string
              nullable: true
          required:
            - gdvMultiplier
            - applied
            - reason
        reasons:
          type: array
          items:
            type: string
      required:
        - assessedLots
        - radiusM
        - publicHousingSignal
        - terraceHousingSignal
        - confidence
        - marketAdjustment
        - reasons
    TransportStopContext:
      type: object
      properties:
        name:
          type: string
        mode:
          type: string
          enum: [bus, train, ferry, unknown]
        distanceM:
          type: number
        routeCount:
          type: number
        serviceIntensity:
          type: string
          enum: [frequent, regular, limited, unknown]
      required:
        - name
        - mode
        - distanceM
        - routeCount
        - serviceIntensity
    TransportContext:
      type: object
      properties:
        publicTransport:
          type: object
          properties:
            accessTier:
              type: string
              enum: [excellent, good, limited, poor, unknown]
            nearestStop:
              allOf:
                - $ref: "#/components/schemas/TransportStopContext"
              nullable: true
            nearestByMode:
              type: array
              items:
                $ref: "#/components/schemas/TransportStopContext"
            confidence:
              type: string
              enum: [high, medium, low, unknown]
          required:
            - accessTier
            - nearestStop
            - nearestByMode
            - confidence
        highwayAccess:
          type: object
          properties:
            name:
              type: string
              nullable: true
            distanceM:
              type: number
              nullable: true
            accessTier:
              type: string
              enum: [excellent, good, neutral, remote, exposureRisk, unknown]
            exposureTier:
              type: string
              enum: [low, moderate, high, unknown]
            confidence:
              type: string
              enum: [high, medium, low, unknown]
          required:
            - name
            - distanceM
            - accessTier
            - exposureTier
            - confidence
        cityCommute:
          type: object
          properties:
            centreName:
              type: string
              nullable: true
            distanceKm:
              type: number
              nullable: true
            durationMinutes:
              type: number
              nullable: true
            convenienceTier:
              type: string
              enum: [excellent, good, limited, poor, unknown]
            confidence:
              type: string
              enum: [high, medium, low, unknown]
          required:
            - centreName
            - distanceKm
            - convenienceTier
            - confidence
        roiInfluence:
          type: object
          properties:
            influence:
              type: string
              enum: [positive, neutral, negative, mixed]
            reasons:
              type: array
              items:
                type: string
            numericAdjustmentApplied:
              type: boolean
              enum: [false]
          required:
            - influence
            - reasons
            - numericAdjustmentApplied
      required:
        - publicTransport
        - highwayAccess
        - cityCommute
        - roiInfluence
    FeasibilityReport:
      type: object
      properties:
        address:
          type: string
        scores:
          $ref: "#/components/schemas/Score"
        propertyOverview:
          $ref: "#/components/schemas/PropertyOverview"
        planning:
          $ref: "#/components/schemas/PlanningInfo"
        asbestos:
          $ref: "#/components/schemas/AsbestosInfo"
        terrain:
          $ref: "#/components/schemas/TerrainInfo"
        infrastructure:
          type: array
          items:
            $ref: "#/components/schemas/InfrastructureService"
        costItems:
          type: array
          items:
            $ref: "#/components/schemas/CostItem"
        totalCostLow:
          type: number
        totalCostHigh:
          type: number
        roiScenarios:
          type: array
          items:
            $ref: "#/components/schemas/ROIScenario"
        comparableSales:
          type: array
          items:
            $ref: "#/components/schemas/ComparableSale"
        neighbourhoodContext:
          $ref: "#/components/schemas/NeighbourhoodContext"
          nullable: true
        transportContext:
          $ref: "#/components/schemas/TransportContext"
          nullable: true
        avgPricePerSqm:
          type: number
        riskSummary:
          type: array
          items:
            type: string
        disclaimer:
          type: string
      required:
        - address
        - scores
    PropertyCandidate:
      type: object
      properties:
        address:
          type: string
        price:
          type: number
        landArea:
          type: number
        zone:
          type: string
        scores:
          $ref: "#/components/schemas/Score"
        briefSummary:
          type: string
      required:
        - address
        - price
        - scores
    AnalyseResponse:
      type: object
      properties:
        report:
          $ref: "#/components/schemas/FeasibilityReport"
        type:
          type: string
          enum: [report]
      required:
        - report
        - type
    SearchResponse:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/PropertyCandidate"
        suburb:
          type: string
        query:
          type: string
        type:
          type: string
          enum: [search]
      required:
        - candidates
        - type
    ChatResponse:
      type: object
      properties:
        message:
          type: string
        type:
          type: string
          enum: [chat]
      required:
        - message
        - type
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
        - error
